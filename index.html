<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログインページ</title>
  <!-- Firebase SDKの読み込み -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js"></script>
  <script>
    // Firebaseの設定
    const firebaseConfig = {
      apiKey: "AIzaSyBQGB-KphFVehOwyGtgSiOrckeauDRAgKw",
      authDomain: "jindori-kansai.firebaseapp.com",
      projectId: "jindori-kansai",
      storageBucket: "jindori-kansai.appspot.com",
      messagingSenderId: "773674958488",
      appId: "1:773674958488:web:3ac4f2819be8b6cc9d5aed"
    };

    // Firebaseの初期化
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // アカウント作成
    async function register() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        alert('アカウント作成成功！');
        console.log('ユーザー作成:', userCredential.user);
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // ログイン
    async function login() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;

      try {
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        alert('ログイン成功！');
        console.log('ログイン成功:', userCredential.user);
        window.location.href = "home.html"; // ログイン後にホーム画面へ遷移
      } catch (error) {
        alert('エラー: ' + error.message);
      }
    }

    // ページ読み込み時に現在のユーザー状態をチェック
    auth.onAuthStateChanged(user => {
      if (user) {
        console.log('現在ログイン中のユーザー:', user);
        // ユーザーがログインしている場合の処理
      } else {
        console.log('ログインしていません');
        // ユーザーがログインしていない場合の処理
      }
    });
  </script>
</head>
<body>
  <h1>ログインページ</h1>
  <div>
    <label for="emailInput">メールアドレス:</label>
    <input type="email" id="emailInput" required>
  </div>
  <div>
    <label for="passwordInput">パスワード:</label>
    <input type="password" id="passwordInput" required>
  </div>
  <button onclick="register()">アカウント作成</button>
  <button onclick="login()">ログイン</button>
</body>
</html>
